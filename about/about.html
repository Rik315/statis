<!DOCTYPE html>
<html>
<head>
<style>

.dropbtn {
    background-color: rgba(185, 40, 40, 0.523);
    color: white;
    padding: 10px;
    font-size: 16px;
    border: none;
    width: 300px;
}

.dropdown {
    position: relative;
    display: inline-block;
}

.dropdown-content {
    display: none;
    position: absolute;
    background-color: lightgrey;
    min-width: 200px;
    z-index: 1;
}

.dropdown-content a {
    color: black;
    padding: 12px 16px;
    text-decoration: none;
    display: block;
}

.dropdown-content a:hover {background-color: white;}
.dropdown:hover .dropdown-content {display: block;}
.dropdown:hover .dropbtn {background-color: grey;}

header {
    padding: 20px;

    width: auto;

    justify-content: space-between;

    align-items: center;

    padding: 10px 20px;

    display: flex;
}

header ul {
    list-style: none;
    display: flex;
    justify-content: center;
    gap: 15px;
    padding: 0;
    margin: 0;
}

header a {
    text-decoration: solid;
    color:black
}

</style>
</head>
<body>

    <header>
        <h2>Perjalanan<span>.</span></h2>
        <nav>

            </ul>
        </nav>
    </header>

<div class="dropdown">

</div>
</div>
</body>
</html>
